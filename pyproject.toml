[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vector-delta-quantization-compactor"
version = "0.1.0"
description = "Online scalar and product quantization engine compressing aging vector memory embeddings with sub-1% recall loss"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-vector-delta-quantization-compactor = "agent_vector_delta_quantization_compactor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_vector_delta_quantization_compactor*"]
